<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Film Forum | Error</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" th:href="@{/style.css}" href="/style.css">
</head>
<body>
<header>
    <nav class="nav">
        <div class="nav-links">
            <a th:href="@{/posts}" th:if="${currentUser != null}">Posts</a>
            <a th:if="${currentUser != null}" th:href="@{/users/me}">Profile</a>
            <a th:if="${currentUser != null and currentUser.admin}" th:href="@{/users}">Users</a>
            <a th:href="@{/login}" th:if="${currentUser == null}">Login</a>
            <form th:if="${currentUser != null}" th:action="@{/logout}" method="post" class="inline-form">
                <button type="submit" class="link-button">Logout</button>
            </form>
        </div>
    </nav>
</header>
<main class="container narrow error-page">
    <h1>Something went wrong</h1>
    <p class="error" th:text="${error != null ? error : 'The requested action could not be completed.'}">Error message</p>
    <a class="button" th:href="@{/}">Back home</a>
</main>
</body>
</html>
